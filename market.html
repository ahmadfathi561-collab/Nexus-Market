<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus | Market</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background: #f8fafc; }
        .tab-content { display: none; }
        .active-tab { display: block; }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
</head>
<body class="pb-20">
    <nav class="bg-white border-b sticky top-0 z-50 p-4 shadow-sm">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="font-black text-indigo-600 text-xl tracking-tighter">NEXUS MARKET</h1>
            <div class="flex gap-4 items-center">
                <span id="userName" class="text-xs font-bold text-slate-600"></span>
                <button onclick="logout()" class="text-xs text-red-500 font-bold bg-red-50 px-3 py-1 rounded-full">Logout</button>
            </div>
        </div>
    </nav>

    <div class="max-w-6xl mx-auto mt-6 px-4">
        <div class="flex gap-2 bg-slate-200 p-1 rounded-2xl w-fit">
            <button onclick="showTab('feed')" class="px-6 py-2 rounded-xl text-sm font-bold transition-all bg-white shadow-sm" id="tabFeed">All Ads</button>
            <button onclick="showTab('profile')" class="px-6 py-2 rounded-xl text-sm font-bold transition-all" id="tabProfile">My Profile</button>
        </div>
    </div>

    <main id="feed" class="tab-content active-tab max-w-6xl mx-auto p-4">
        <div id="allAdsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
    </main>

    <main id="profile" class="tab-content max-w-6xl mx-auto p-4">
        <div class="bg-indigo-600 rounded-[2rem] p-8 text-white mb-8 shadow-xl shadow-indigo-100">
            <h2 class="text-2xl font-bold">Seller Dashboard</h2>
            <p class="text-indigo-100 text-sm mt-1">Manage your listings and track performance</p>
            <button onclick="openPostModal()" class="mt-6 bg-white text-indigo-600 px-6 py-3 rounded-2xl font-bold text-sm shadow-xl">Post New Ad</button>
        </div>

        <div class="bg-white border-2 border-dashed border-slate-200 rounded-[2rem] p-6 mb-8 text-center">
            <h3 class="font-bold text-slate-800 mb-1">Technical Support</h3>
            <p class="text-xs text-slate-500 mb-4">Working Hours: 9:00 AM - 12:00 PM</p>
            <a href="https://wa.me/201035153618" target="_blank" class="inline-flex items-center gap-2 bg-green-500 text-white px-6 py-2 rounded-full font-bold text-sm shadow-lg hover:bg-green-600 transition-colors">
                WhatsApp Support
            </a>
        </div>

        <h3 class="font-bold text-slate-800 mb-4 px-2">My Listings</h3>
        <div id="myAdsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
    </main>

    <div id="postModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[60] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-[2.5rem] p-8 max-h-[90vh] overflow-y-auto">
            <h2 id="modalTitle" class="text-xl font-bold mb-6">Create New Ad</h2>
            <form id="realAdForm" class="space-y-4">
                <input type="hidden" id="editAdId">
                <div>
                    <label class="text-xs font-bold text-slate-500 ml-2">Images (Can select multiple)</label>
                    <input type="file" id="adImgs" accept="image/*" class="w-full text-xs mt-1" multiple>
                </div>
                <input type="text" id="adTitle" placeholder="Product Title" class="w-full bg-slate-100 p-4 rounded-xl outline-none" required>
                <textarea id="adDesc" placeholder="Product Description" class="w-full bg-slate-100 p-4 rounded-xl outline-none h-24" required></textarea>
                <div class="flex gap-2">
                    <input type="number" id="adPrice" placeholder="Price (EGP)" class="w-1/2 bg-slate-100 p-4 rounded-xl outline-none" required>
                    <input type="tel" id="adPhone" placeholder="Phone Number" class="w-1/2 bg-slate-100 p-4 rounded-xl outline-none" required>
                </div>
                <button type="submit" id="submitBtn" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold shadow-lg">Publish Ad</button>
                <button type="button" onclick="closeModal('postModal')" class="w-full text-slate-400 text-sm">Cancel</button>
            </form>
        </div>
    </div>

    <div id="deleteConfirmModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[70] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-xs rounded-[2rem] p-6 text-center">
            <h3 class="font-bold text-slate-800 mb-2">Delete Ad?</h3>
            <p class="text-xs text-slate-500 mb-6">This action cannot be undone. Are you sure?</p>
            <div class="flex gap-2">
                <button onclick="closeModal('deleteConfirmModal')" class="flex-1 py-3 bg-slate-100 rounded-xl font-bold text-xs">Cancel</button>
                <button id="finalDeleteBtn" class="flex-1 py-3 bg-red-500 text-white rounded-xl font-bold text-xs">Delete</button>
            </div>
        </div>
    </div>

    <div id="viewModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[60] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-2xl rounded-[2.5rem] overflow-hidden relative">
            <button onclick="closeModal('viewModal')" class="absolute top-4 right-4 bg-white/80 rounded-full p-2 z-10">✕</button>
            <div id="viewContent" class="max-h-[90vh] overflow-y-auto"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // إعدادات فايربيز الحقيقية لمشروعك
        const firebaseConfig = {
            apiKey: "AIzaSyDzLe3jTcocOUATfmbnICIbGoz7Shl8RA",
            authDomain: "nexus-d563a.firebaseapp.com",
            projectId: "nexus-d563a",
            storageBucket: "nexus-d563a.appspot.com",
            messagingSenderId: "856502668187",
            appId: "1:856502668187:web:e3f2832077e5ba1c76da2f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // التحقق من تسجيل الدخول
        let currentUser = JSON.parse(sessionStorage.getItem('loggedInUser'));
        if(!currentUser) window.location.href = 'login.html';
        document.getElementById('userName').innerText = `Hello, ${currentUser.name}`;

        // التبديل بين التابات
        window.showTab = function(tab) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active-tab'));
            document.getElementById(tab).classList.add('active-tab');
            document.getElementById('tabFeed').classList.toggle('bg-white', tab === 'feed');
            document.getElementById('tabProfile').classList.toggle('bg-white', tab === 'profile');
            fetchAndRenderAds();
        }

        window.closeModal = function(id) { document.getElementById(id).classList.add('hidden'); }

        window.openPostModal = function(adId = null) {
            const modal = document.getElementById('postModal');
            const title = document.getElementById('modalTitle');
            const submitBtn = document.getElementById('submitBtn');
            
            if(adId) {
                // تعديل (يمكنك ربطها بـ Firebase update لاحقاً لو حابب)
                title.innerText = "Edit Your Ad";
                submitBtn.innerText = "Update Changes";
            } else {
                document.getElementById('realAdForm').reset();
                document.getElementById('editAdId').value = '';
                title.innerText = "Create New Ad";
                submitBtn.innerText = "Publish Ad";
            }
            modal.classList.remove('hidden');
        }

        // تحويل الصورة لـ Base64 لتخزينها سحابياً كـ String مؤقتاً
        const toBase64 = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });

        // حدث إرسال الفورم ورفعه لـ Firebase
        document.getElementById('realAdForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const title = document.getElementById('adTitle').value.trim();
            const desc = document.getElementById('adDesc').value.trim();
            const price = document.getElementById('adPrice').value.trim();
            const phone = document.getElementById('adPhone').value.trim();
            const files = document.getElementById('adImgs').files;

            Swal.fire({
                title: 'جاري النشر سحابياً...',
                text: 'يرجى الانتظار لحين رفع البيانات والصور',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); }
            });

            let images = [];
            if(files.length > 0) {
                for(let file of files) {
                    const base64 = await toBase64(file);
                    images.push(base64);
                }
            } else {
                images.push('https://via.placeholder.com/400');
            }

            try {
                // رفع الإعلان إلى مجموعة products في Firestore
                await addDoc(collection(db, "products"), {
                    seller: currentUser.email,
                    sellerName: currentUser.name,
                    title: title,
                    desc: desc,
                    price: price,
                    phone: phone,
                    img: images,
                    views: 0,
                    isSold: false,
                    createdAt: new Date().toISOString()
                });

                Swal.close();
                Swal.fire({ icon: 'success', title: 'تم النشر بنجاح!', text: 'إعلانك متصل بالسيرفر الآن.' });
                closeModal('postModal');
                fetchAndRenderAds();

            } catch (error) {
                console.error("Error adding document: ", error);
                Swal.close();
                Swal.fire({ icon: 'error', title: 'خطأ في الرفع', text: 'تأكد من إعدادات الـ Rules في السيرفر.' });
            }
        });

        // جلب البيانات من فايربيز وعرضها في الروم والبروفايل
        async function fetchAndRenderAds() {
            const allAdsGrid = document.getElementById('allAdsGrid');
            const myAdsGrid = document.getElementById('myAdsGrid');
            if(!allAdsGrid || !myAdsGrid) return;

            allAdsGrid.innerHTML = '';
            myAdsGrid.innerHTML = '';

            try {
                const q = query(collection(db, "products"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);

                querySnapshot.forEach((doc) => {
                    const ad = doc.data();
                    const adId = doc.id;

                    // عرض الإعلانات النشطة في الـ Feed الرئيسي
                    if(!ad.isSold) {
                        const card = `
                        <div class="bg-white p-3 rounded-[2rem] shadow-sm border border-slate-100 cursor-pointer hover:shadow-md transition-all group">
                            <img src="${ad.img[0]}" class="h-44 w-full object-cover rounded-[1.5rem] mb-3 group-hover:scale-[1.02] transition-transform">
                            <div class="px-2">
                                <h4 class="font-bold text-slate-800 truncate">${ad.title}</h4>
                                <p class="text-indigo-600 font-bold">${ad.price} EGP</p>
                                <p class="text-[10px] text-slate-400 mt-2 flex justify-between">
                                    <span>👤 ${ad.sellerName || 'Anonymous'}</span>
                                    <span>👁️ ${ad.views || 0}</span>
                                </p>
                            </div>
                        </div>`;
                        allAdsGrid.innerHTML += card;
                    }

                    // عرض إعلانات المستخدم الحالي في بروفايله
                    if(ad.seller === currentUser.email) {
                        const myCard = `
                        <div class="bg-white p-4 rounded-[2rem] border border-slate-200 flex flex-col sm:flex-row gap-4 items-center">
                            <img src="${ad.img[0]}" class="w-24 h-24 object-cover rounded-2xl">
                            <div class="flex-1 min-w-0 w-full">
                                <h4 class="font-bold truncate text-slate-800">${ad.title}</h4>
                                <p class="text-indigo-600 font-bold text-sm">${ad.price} EGP</p>
                                <div class="flex flex-wrap gap-2 mt-3">
                                    <span class="text-[10px] font-bold bg-green-50 text-green-600 px-3 py-1 rounded-lg">Cloud Active</span>
                                </div>
                            </div>
                        </div>`;
                        myAdsGrid.innerHTML += myCard;
                    }
                });
            } catch (error) {
                console.error("Error fetching documents: ", error);
            }
        }

        window.logout = function() {
            sessionStorage.clear();
            window.location.href = 'login.html';
        }

        // تشغيل الجلب التلقائي عند تحميل الصفحة
        fetchAndRenderAds();
    </script>
</body>
</html>
